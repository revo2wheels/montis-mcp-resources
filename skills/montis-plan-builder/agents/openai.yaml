interface:
  display_name: "Montis.icu Plan Builder"
  short_description: "Build governed multi-week endurance plans"
  icon_small: "./assets/icon-48.png"
  icon_large: "./assets/icon-256.png"
  default_prompt: "Use $montis-plan-builder to build a governed multi-week training plan from my connected Montis.icu data."

dependencies:
  tools:
    - type: "mcp"
      value: "montis-icu"
      description: "Access authorized Montis.icu coaching data, reports, workouts, and calendar workflows."
      transport: "streamable_http"
      url: "https://montis.icu/mcp"

policy:
  allow_implicit_invocation: true
